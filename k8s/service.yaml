apiVersion: v1
kind: Service
metadata:
  name: demo-app-service
  namespace: demo-app
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "demo-app-backendconfig"}'
spec:
  type: ClusterIP
  selector:
    app: demo-app
  ports:
    - name: http
      port: 80
      targetPort: 8000